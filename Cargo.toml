[package]
name = "bevy-wgsl"
version = "0.1.0"
edition = "2024"
description = "Bevy WESL shaders"

[workspace]
resolver = "3"
members = ["examples/builder", "examples/consumer"]

[dependencies]
wesl-core = { version = "0.1.0" }

[build-dependencies]
wesl = { version = "0.6.0", features = ["naga-ext", "package"] }

[patch.crates-io]
wesl = { path = "../wesl-rs/crates/wesl" }
wesl-core = { path = "../wesl-rs/crates/wesl-core" }
